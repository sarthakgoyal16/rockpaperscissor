<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="navbar">ROCK PAPER SCISSOR</div>
    <div class="choices">
      <div class="choice" id="rock">
        <img id="object" src="ROCK.png" alt="rock"/>
      </div>
      <div class="choice" id="paper">
        <img id="object" src="PAPER.png" alt="paper"/>
      </div>
      <div class="choice" id="scissor">
        <img id="object" src="SCISSOR.png" alt="scissor"/>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score">
        <p id="user-score">0</p>
        <p>YOU</p>
        </div>
        <div class="score">
          <p id="comp-score">0</p>
          <p>COMP</p>
      </div>
    </div>

    <div class="msg-container">
        <p id="msg">PLAY YOUR MOVE</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
